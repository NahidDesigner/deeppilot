<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Geist;src:url(../fonts/Geist-Variable.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:GeistMono;src:url(../fonts/GeistMono-Variable.woff2) format('woff2');font-weight:100 900}
*{box-sizing:border-box;margin:0}
body{width:1280px;height:680px;overflow:hidden;font-family:Geist;background:#0f1522;color:#eef1f7;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(600px 380px at 78% 30%, rgba(190,236,74,.20), transparent 70%),
 radial-gradient(500px 400px at 10% 100%, rgba(95,208,168,.12), transparent 70%),
 linear-gradient(180deg,#121a2a,#0c111c)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(900px 600px at 40% 40%,#000 40%,transparent 80%)}
.left{position:absolute;left:72px;top:92px;width:520px}
.brand{display:flex;align-items:center;gap:14px;font-family:GeistMono;font-weight:700;letter-spacing:.32em;font-size:17px;color:#cfd6e4}
.brand img{width:40px;height:40px;border-radius:10px}
h1{font-family:GeistMono;font-weight:700;font-size:58px;line-height:1.02;letter-spacing:-.035em;margin-top:34px}
h1 em{font-style:normal;color:#c3ef4c}
p.sub{font-size:20px;line-height:1.5;color:#b7c0d1;margin-top:22px;max-width:470px}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:30px;max-width:500px}
.chip{font-family:GeistMono;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;border:1px solid rgba(255,255,255,.14);border-radius:999px;color:#dfe5ef;background:rgba(255,255,255,.04)}
.chip b{color:#c3ef4c;font-weight:700}
.foot{position:absolute;left:72px;bottom:46px;font-family:GeistMono;font-size:13px;letter-spacing:.08em;color:#7f8aa0}
.shot{position:absolute;border-radius:18px;overflow:hidden;box-shadow:0 40px 80px -20px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08)}
.shot img{display:block;width:100%}
.s1{width:300px;left:650px;top:84px;transform:rotate(-3deg)}
.s2{width:320px;left:880px;top:56px;z-index:2}
.s3{width:280px;left:1030px;top:150px;transform:rotate(4deg);opacity:.96}
</style></head><body><div class="bg"></div><div class="grid"></div>
<div class="left">
 <div class="brand"><img src="../icons/logo.png">DEEPPILOT</div>
 <h1>An AI agent<br>that flies your<br><em>browser.</em></h1>
 <p class="sub">Clicks, types, researches and hands you finished files — on your own DeepSeek key, for a few cents a task.</p>
 <div class="chips"><span class="chip"><b>●</b> Agents</span><span class="chip"><b>×4</b> Parallel tabs</span><span class="chip">Excel · PDF · Word</span><span class="chip">Chrome Sync</span><span class="chip">Open source · MIT</span></div>
</div>
<div class="foot">CHROME EXTENSION · MANIFEST V3 · NO BUILD STEP</div>
<div class="shot s1"><img src="../docs/screenshots/03-agents.png"></div>
<div class="shot s2"><img src="../docs/screenshots/05-parallel-tabs.png"></div>
<div class="shot s3"><img src="../docs/screenshots/08-landed-files.png"></div>
</body></html>

name: ✨ Feature request
description: An idea to make DeepPilot better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to get done?
      description: The job, not the solution. What would you ask DeepPilot to do?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: How could DeepPilot help?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried or seen elsewhere?
